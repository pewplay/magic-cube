<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9e4f1">
  <title>Magic Cube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gl" aria-label="Magic Cube puzzle"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- In-game stats -->
  <header id="hud" class="panel hidden">
    <button id="btnMenu" class="btn icon" aria-label="Menu" title="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="stats">
      <div class="stat main"><span class="lbl">Time</span><span id="time" class="val">0:00.00</span></div>
      <div class="stat"><span class="lbl">Moves</span><span id="moves" class="val">0</span></div>
      <div class="stat"><span class="lbl">Best</span><span id="best" class="val">--</span></div>
    </div>
    <button id="btnMute" class="btn icon" aria-label="Toggle sound" title="Sound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
  </header>

  <!-- In-game actions -->
  <nav id="bar" class="panel hidden">
    <div class="seg" id="sizeSeg" role="group" aria-label="Cube size">
      <button class="btn" data-n="2">2×2</button>
      <button class="btn" data-n="3">3×3</button>
      <button class="btn" data-n="4">4×4</button>
    </div>
    <div class="acts">
      <button id="btnUndo" class="btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo</button>
      <button id="btnScramble" class="btn primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3c5 0 7 10 12 10h3M3 17h3c2 0 3.5-1.6 4.8-3.6M13.2 9.6C14.5 8 16 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>Scramble</button>
      <button id="btnReset" class="btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6"/><path d="M4 3.5v5.1h5.1"/></svg>Reset</button>
    </div>
  </nav>

  <div id="toast" class="hidden"></div>

  <!-- Start menu -->
  <section id="menu" class="overlay">
    <div id="menuCard" class="card">
      <h1>Magic <span>Cube</span></h1>
      <p class="sub">Twist the layers until every face shows a single colour.</p>
      <div class="sizes" id="menuSizes">
        <button class="size" data-n="2"><b>2×2</b><small>Pocket</small><em data-best="2">--</em></button>
        <button class="size" data-n="3"><b>3×3</b><small>Classic</small><em data-best="3">--</em></button>
        <button class="size" data-n="4"><b>4×4</b><small>Master</small><em data-best="4">--</em></button>
      </div>
      <button id="btnPlay" class="btn primary big">Play</button>
      <p class="help">Drag a sticker to turn its layer · drag empty space to look around</p>
    </div>
  </section>

  <!-- Result card -->
  <section id="result" class="overlay dim hidden">
    <div class="card">
      <button id="btnCloseRes" class="btn icon close" aria-label="Close" title="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h2>Solved!</h2>
      <p id="resSize" class="sub">3×3 cube</p>
      <div class="resTime" id="resTime">0:00.00</div>
      <p class="resLine"><span id="resMoves">0</span> moves</p>
      <p class="resBest" id="resBest">New best!</p>
      <div class="row">
        <button id="btnAgain" class="btn primary big">Play again</button>
        <button id="btnToMenu" class="btn big">Menu</button>
      </div>
    </div>
  </section>

  <div id="nogl" class="overlay hidden"><div class="card"><h2>WebGL needed</h2><p class="sub">Your browser could not start 3D graphics, so Magic Cube cannot run here.</p></div></div>

  <script src="game.js"></script>
</body>
</html>
